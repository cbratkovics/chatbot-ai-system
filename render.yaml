# Render blueprint for the free-tier demo.
# One web service, one worker, no Redis, no Pinecone. Every external dependency is
# optional: the app falls back to an in-process cache and reports what it is using
# on /health.
services:
  - type: web
    name: chatbot-ai-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install poetry && poetry install --only main"
    # One worker: the free tier has 512 MB and in-process caches/limits are per worker.
    startCommand: "poetry run uvicorn chatbot_ai_system.server.main:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 65"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DEFAULT_MODEL
        value: gpt-4o-mini
      - key: FALLBACK_MODELS
        value: groq:openai/gpt-oss-20b
      - key: REQUEST_TIMEOUT
        value: 30
      - key: MAX_RETRIES
        value: 2
      - key: CACHE_ENABLED
        value: true
      - key: CACHE_TTL_SECONDS
        value: 3600
      # Paraphrase matching via OpenAI embeddings (ADR 0007). Threshold comes from the eval sweep.
      - key: SEMANTIC_CACHE_ENABLED
        value: true
      - key: SEMANTIC_CACHE_THRESHOLD
        value: 0.85
      - key: SEMANTIC_CACHE_MAX_ENTRIES
        value: 512
      - key: ENABLE_VECTOR_SEARCH
        value: false
      - key: DEMO_GUARDRAILS_ENABLED
        value: true
      - key: DEMO_RATE_LIMIT_PER_MINUTE
        value: 10
      - key: DEMO_RATE_LIMIT_PER_DAY
        value: 40
      - key: DEMO_MAX_TOKENS
        value: 400
      - key: DEMO_MAX_HISTORY_MESSAGES
        value: 8
      - key: DEMO_DAILY_TOKEN_BUDGET
        value: 150000
      # Shows the "Simulate provider failure" toggle in the UI (header-driven, per request).
      - key: DEMO_FAILURE_TOGGLE_ENABLED
        value: true
      # Set to the real Vercel origin in the dashboard.
      - key: CORS_ORIGINS
        value: '["https://chatbot-ai-system.vercel.app","http://localhost:3000"]'
      - key: CORS_ALLOW_CREDENTIALS
        value: true
