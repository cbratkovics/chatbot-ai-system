name: Offline validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      docker:
        description: Also build the optional local backend Docker image (no push)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "2.1.4"
  ALLOW_LIVE_TESTS: "0"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  frontend:
    name: Static public release checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-browser-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: frontend/out/
          retention-days: 3

  backend:
    name: Offline backend reference (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true
      - uses: actions/cache@v4
        with:
          path: .venv
          key: backend-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('poetry.lock') }}
      - run: poetry install --no-interaction
      - run: poetry run ruff check .
      - run: poetry run mypy src/ --ignore-missing-imports
      # Includes deterministic failover timing; socket guard forbids external DNS/connects.
      # No TEST_* targets, provider secrets, Redis, Postgres or deploy hooks are supplied.
      - run: poetry run pytest tests/ --cov=chatbot_ai_system --cov-report=xml
      - run: poetry check && poetry build
      - uses: actions/upload-artifact@v4
        with:
          name: backend-reference-${{ matrix.python }}
          path: |
            dist/
            coverage.xml
            benchmarks/results/tmp/
          retention-days: 3

  docker:
    name: Optional backend image check
    if: github.event_name == 'workflow_dispatch' && inputs.docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/dockerfiles/Dockerfile
          push: false
          tags: chatbot-ai-system:local-reference
